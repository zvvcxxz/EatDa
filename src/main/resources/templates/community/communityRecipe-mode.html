<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>요리모드 · 잇다</title>
</head>
<body>

<th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/dist/css/community-free.css}">
    <link rel="stylesheet" th:href="@{/dist/css/community-board.css}">

    <link rel="stylesheet" th:href="@{/dist/css/community-recipe-mode.css}">
</th:block>

<div layout:fragment="content"
     class="community-orange community-design">

    <section class="hero-banner">
        <div class="hero-card">
            <div>
                <span class="hero-tag">✨ 함께하는 주방</span>
                <h1 class="hero-title">한 끼를 나누고, 맛있는 일상을 잇다.</h1>
                <p class="hero-sub">
                    직접 만든 레시피부터 따라 만든 한 접시까지, 함께 나누어요.
                </p>
            </div>
        </div>
    </section>

    <div class="main-wrapper">
        <aside class="sidebar">
            <h2 class="sidebar-title">COMMUNITY</h2>

            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a th:href="@{/community/free}">💬 자유 이야기</a>
                </li>
                <li class="sidebar-item active">
                    <a th:href="@{/community/recipes}">🍳 모두의 레시피</a>
                </li>
                <li class="sidebar-item">
                    <a th:href="@{/community/cooking}">📸 따라 만든 요리</a>
                </li>
                <li class="sidebar-item">
                    <a th:href="@{/community/questions}">🙋 요리 질문</a>
                </li>
            </ul>

            <div class="sidebar-footer-text">
                각자의 한 끼가 모여<br>
                우리의 따뜻한 주방이 됩니다.
            </div>
        </aside>

        <section class="content-area">
            <div class="ds-heading compact">
                <div>
                    <p class="ds-eyebrow">COOKING MODE</p>
                    <h2>한 단계씩 따라 만들어요.</h2>
                    <p>이전·다음 버튼으로 조리 순서를 확인해 주세요.</p>
                </div>

                <a class="ds-button light"
                   th:href="@{/community/recipes/{id}(id=${recipe.recipeId})}">
                    ← 레시피 전체보기
                </a>
            </div>

            <article class="ds-paper">
                <h2 class="cooking-title" th:text="${recipe.title}"></h2>

                <th:block th:if="${!#lists.isEmpty(recipeSteps)}">
                    <p id="stepCount" class="cooking-count"
                       th:text="${'1 / ' + #lists.size(recipeSteps) + ' 단계'}">
                    </p>

                    <progress id="cookingProgress"
                              class="cooking-progress"
                              value="1"
                              th:max="${#lists.size(recipeSteps)}">
                    </progress>

                    <!-- DB에서 가져온 단계 중 하나씩 표시 -->
                    <section class="cooking-stage"
                             th:each="step, state : ${recipeSteps}"
                             th:attr="hidden=${!state.first}"
                             th:classappend="${#strings.isEmpty(step.imageUrl)}
                                             ? 'without-photo' : ''">

                        <div>
                            <h3 th:text="${'STEP ' + step.stepNo}"></h3>

                            <p class="cooking-description"
                               th:text="${step.description}"></p>

                            <div class="cooking-timer"
                                 th:if="${step.timerSeconds != null
                                         and step.timerSeconds > 0}"
                                 th:attr="data-seconds=${step.timerSeconds}">

                                <span>⏱</span>

                                <span class="cooking-clock">00:00</span>

                                <button type="button"
                                        class="ds-button primary"
                                        data-timer-start>
                                    시작
                                </button>

                                <button type="button"
                                        class="ds-button light"
                                        data-timer-reset>
                                    초기화
                                </button>

                                <span class="cooking-timer-message"
                                      role="status">
                                    준비
                                </span>
                            </div>
                        </div>

                        <img class="cooking-photo"
                             th:if="${!#strings.isEmpty(step.imageUrl)}"
                             th:src="@{${step.imageUrl}}"
                             th:alt="${'조리 단계 ' + step.stepNo}">
                    </section>

                    <div class="cooking-navigation">
                        <button id="previousStep" type="button"
                                class="ds-button light" disabled>
                            ← 이전 단계
                        </button>

                        <button id="nextStep" type="button"
                                class="ds-button primary">
                            다음 단계 →
                        </button>

                        <a id="finishCooking" class="ds-button primary"
                           hidden
                           th:href="@{/community/recipes/{id}(id=${recipe.recipeId})}">
                            완료 · 전체보기
                        </a>
                    </div>
                </th:block>

                <p class="cooking-empty"
                   th:if="${#lists.isEmpty(recipeSteps)}">
                    등록된 조리 단계가 없습니다.
                </p>
            </article>
        </section>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/dist/js/community-recipe-mode.js}"></script>
</th:block>

</body>
</html>
