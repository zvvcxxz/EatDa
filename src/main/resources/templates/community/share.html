<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head><title>재료 나눔 · 잇다</title></head>
<body><th:block layout:fragment="content"><div data-community="share">
    
    <main class="wrap community-main">
      <p class="muted">함께하는 주방 / 재료 나눔</p>
      <section class="hero">
        <span class="pill">함께하는 주방</span>
        <h1>재료 나눔</h1>
        <p>남는 재료를 나누고, 이웃과 연결해요.</p>
      </section>
      <nav class="community-tabs">
        <a href="share.html" th:href="@{/community/share}" class="button"
          >재료 나눔</a
        ><a
          href="meet.html"
          th:href="@{/community/meet}"
          class="button secondary"
          >같이 먹어요</a
        >
      </nav>
      <form id="post-filters" class="post-toolbar">
        <input
          id="post-query"
          class="text-input"
          placeholder="제목 또는 장소 검색"
          aria-label="게시글 검색어"
        /><select id="post-status" class="text-input" aria-label="모집 상태">
          <option value="">전체 상태</option>
          <option value="OPEN">모집 중</option>
          <option value="COMPLETED">완료</option>
          <option value="CANCELLED">취소</option></select
        ><button class="button secondary">검색</button
        ><button type="button" id="post-new" class="button">글쓰기</button>
      </form>
      <p id="post-message" class="status" role="status"></p>
      <section id="post-list" class="post-grid"></section>
      <div class="more-wrap">
        <button id="post-more" class="button secondary" hidden>더 보기</button>
      </div>
    </main>
    <dialog id="post-detail-dialog" class="modal">
      <div class="modal-head">
        <h2>재료 나눔 상세</h2>
        <button
          class="icon-button"
          data-close="post-detail-dialog"
          aria-label="상세 닫기"
        >
          ✕
        </button>
      </div>
      <div id="post-detail" class="modal-body"></div>
    </dialog>
    <dialog id="post-editor" class="modal">
      <div class="modal-head">
        <h2 id="post-editor-title">글 등록</h2>
        <button
          class="icon-button"
          data-close="post-editor"
          aria-label="작성 닫기"
        >
          ✕
        </button>
      </div>
      <form id="post-form" class="modal-body form-stack">
        <label class="field"
          >제목<input name="title" maxlength="200" required /></label
        ><label class="field"
          >장소<input name="locationText" maxlength="300" required
        /></label>
        <div class="field-grid">
          <label class="field"
            >나눔 방식<select name="shareType">
              <option value="FREE">무료 나눔</option>
              <option value="EXCHANGE">교환</option>
            </select></label
          ><label class="field"
            >나눔 시작<input
              name="availableFrom"
              type="datetime-local"
              required /></label
          ><label class="field"
            >나눔 종료<input
              name="availableUntil"
              type="datetime-local"
              required /></label
          ><label class="field"
            >교환 조건<input name="exchangeNote" maxlength="500" /></label
          ><label class="field"
            >모집 인원 (작성자 제외)<input
              name="capacity"
              type="number"
              min="1"
              max="99999"
              required /></label
          ><label class="field"
            >진행 상태<select name="status">
              <option value="OPEN">모집 중</option>
              <option value="RESERVED">예약 중</option>
              <option value="COMPLETED">완료</option>
              <option value="CANCELLED">취소</option>
            </select></label
          >
        </div>
        <section>
          <h3>나눌 재료</h3>
          <div id="post-ingredients"></div>
          <button
            id="add-post-ingredient"
            type="button"
            class="button secondary"
          >
            재료 추가
          </button>
        </section>
        <label class="field"
          >내용<textarea name="content" required></textarea>
        </label>
        <p id="post-form-message" class="status" role="alert"></p>
        <button class="button" type="submit">저장</button>
      </form>
    </dialog>
    <dialog id="delete-dialog" class="modal">
      <div class="modal-head">
        <h2>게시글 삭제</h2>
        <button
          class="icon-button"
          data-close="delete-dialog"
          aria-label="삭제 닫기"
        >
          ✕
        </button>
      </div>
      <div class="modal-body">
        <p>이 게시글을 삭제할까요?</p>
        <div class="actions">
          <button id="confirm-delete" class="button danger">삭제</button
          ><button class="button secondary" data-close="delete-dialog">
            취소
          </button>
        </div>
        <p id="delete-message" class="status" role="alert"></p>
      </div>
    </dialog>
    
    
    
  </div></th:block>
<th:block layout:fragment="script"><script
      type="module"
      src="../../static/dist/js/community.js"
      th:src="@{/dist/js/community.js}"
    ></script></th:block></body></html>
