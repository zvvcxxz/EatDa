<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head><title>후기 작성 · 잇다</title></head><body>
<th:block layout:fragment="css">
    <!-- 자유 이야기의 공통 분위기 + 새 게시판 전용 스타일 -->
    <link rel="stylesheet" th:href="@{/dist/css/community-free.css}">
    <link rel="stylesheet" th:href="@{/dist/css/community-board.css}">
</th:block>
<div layout:fragment="content" class="community-orange community-design" data-view="review-write" th:attr="data-id=${previewId}">
<section class="hero-banner"><div class="hero-card"><div><span class="hero-tag">✨ 함께하는 주방</span><h1 class="hero-title">한 끼를 나누고, 맛있는 일상을 잇다.</h1><p class="hero-sub">직접 만든 레시피부터 따라 만든 한 접시까지, 함께 나누어요.</p></div></div></section><div class="main-wrapper"><aside class="sidebar"><h2 class="sidebar-title">COMMUNITY</h2><ul class="sidebar-menu">
<li class="sidebar-item" th:classappend="${activeMenu == 'free'} ? 'active' : ''"><a th:href="@{/community/free}" href="/community/free">💬 자유 이야기</a></li>
<li class="sidebar-item" th:classappend="${activeMenu == 'recipes'} ? 'active' : ''"><a th:href="@{/community/recipes}" href="/community/recipes">🍳 모두의 레시피</a></li>
<li class="sidebar-item" th:classappend="${activeMenu == 'cooking'} ? 'active' : ''"><a th:href="@{/community/cooking}" href="/community/cooking">📸 따라 만든 요리</a></li>
<li class="sidebar-item" th:classappend="${activeMenu == 'questions'} ? 'active' : ''"><a th:href="@{/community/questions}" href="/community/questions">🙋 요리 질문</a></li>
</ul><div class="sidebar-footer-text">각자의 한 끼가 모여<br>우리의 따뜻한 주방이 됩니다.</div></aside><section class="content-area">
<div class="ds-heading"><div><p class="ds-eyebrow">MY COOKING STORY</p><h2>저도 따라 만들었어요!</h2><p>원본 레시피와 연결된 나만의 요리 후기를 남겨요.</p></div></div><form class="ds-paper ds-form" id="reviewForm"><!-- 선택한 원본 레시피 번호 -->
<input type="hidden" id="reviewRecipeId" name="recipeId" value="0">
<div id="reviewOriginal" class="ds-original"></div><div class="ds-field"><label for="reviewTitle">후기 제목 <b>*</b></label><input id="reviewTitle" name="title" required maxlength="200" placeholder="예: 처음 만들어 본 파스타, 성공했어요!"></div><div class="ds-field"><label for="reviewPhoto">내가 만든 요리 사진</label><label class="ds-photo-upload wide"><img id="reviewPhotoPreview" alt="결과 사진 미리보기" hidden><span>📷<br>완성한 요리 사진 선택</span><input id="reviewPhoto" name="selectFile" type="file" accept="image/*" data-preview="reviewPhotoPreview"></label></div><div class="ds-field"><label for="reviewContent">요리 후기 <b>*</b></label><textarea id="reviewContent" name="content" rows="5" maxlength="2000" required placeholder="만들면서 느낀 점과 맛있게 먹은 이야기를 들려주세요."></textarea></div><div class="ds-bottom-actions"><a class="ds-button light" data-link="reviews">취소</a><button type="submit" class="ds-button primary" id="reviewSubmit">후기 등록</button></div></form></section></div>

<!-- 후기 작성 화면 안에서 원본 레시피 선택 -->
<dialog id="recipePicker" class="ds-recipe-picker" aria-labelledby="recipePickerTitle">
    <div class="ds-picker-heading">
        <div><p class="ds-eyebrow">ORIGINAL RECIPE</p><h3 id="recipePickerTitle">어떤 레시피를 따라 만들었나요?</h3></div>
        <button type="button" id="closeRecipePicker" class="ds-icon-button" aria-label="원본 선택 창 닫기">×</button>
    </div>
    <div class="ds-picker-body">
        <label class="ds-search"><span aria-hidden="true">⌕</span><input id="recipePickerSearch" placeholder="요리명 또는 작성자 검색" aria-label="원본 레시피 검색"></label>
        <p class="ds-help" style="margin-top:10px">따라 만든 원본 레시피를 선택해 주세요.</p>
        <div id="recipePickerList" class="ds-picker-list"></div>
    </div>
</dialog>

<div id="designToast" class="ds-toast" role="status" hidden></div>
</div>
<th:block layout:fragment="script">
    <script th:src="@{/dist/js/community-design-data.js}"></script>
    <script th:src="@{/dist/js/community-design.js}"></script>
</th:block>
</body></html>
