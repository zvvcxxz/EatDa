<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="replyContent">

    <!-- 댓글 입력 영역 -->
    <div class="reply-form">
        <h2>💬 댓글</h2>

        <label for="communityReplyContent">댓글 작성</label>
        <textarea id="communityReplyContent" name="content"
                  placeholder="따뜻한 댓글을 남겨보세요."></textarea>

        <div class="reply-form-buttons">
            <button type="button" class="community-button btnSendReply">
                댓글 등록
            </button>
        </div>
    </div>

    <!-- 댓글 목록과 페이징은 JS에서 채움 -->
    <div id="listReply">
        <div class="reply-info">
            <span class="reply-count"></span>
            <span class="reply-page"></span>
        </div>

        <div class="list-content" data-page-no="1" aria-live="polite"></div>

        <div class="list-footer">
            <div class="page-navigation"></div>
        </div>
    </div>

</th:block>

</html>
