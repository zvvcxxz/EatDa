<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title th:text="${pageTitle}">자유 이야기 작성</title>
</head>

<body>

<th:block layout:fragment="css">
    <!-- 새 커뮤니티 디자인 -->
    <link rel="stylesheet" th:href="@{/dist/css/community-free.css}">
    <link rel="stylesheet" th:href="@{/dist/css/community-board.css}">
    
</th:block>

<div layout:fragment="content" class="community-orange community-design">
    <section class="hero-banner"><div class="hero-card"><div><span class="hero-tag">✨ 함께하는 주방</span><h1 class="hero-title">한 끼를 나누고, 맛있는 일상을 잇다.</h1><p class="hero-sub">직접 만든 레시피부터 따라 만든 한 접시까지, 함께 나누어요.</p></div></div></section>
<div class="main-wrapper">

        <aside class="sidebar">
            <h2 class="sidebar-title">COMMUNITY</h2>
            <ul class="sidebar-menu">
                <li class="sidebar-item active">
                    <a th:href="@{/community/free}">💬 자유 이야기</a>
                </li>
                <li class="sidebar-item">
                    <a th:href="@{/community/recipes}">🍳 모두의 레시피</a>
                </li>
                <li class="sidebar-item">
                    <a th:href="@{/community/cooking}">📸 따라 만든 요리</a>
                </li>
                <li class="sidebar-item">
                    <a th:href="@{/community/questions}">🙋‍♀️ 요리 질문</a>
                </li>
            </ul>
            <div class="sidebar-footer-text">
                각자의 한 끼가 모여<br>
                우리의 따뜻한 주방이 됩니다.
            </div>
        </aside>

        <div class="content-area">
            <div class="ds-heading">
                <div>
                    <p class="ds-eyebrow">FREE TALK</p>
                    <h2 th:text="${pageTitle}">자유 이야기 작성</h2>
                    <p>나누고 싶은 이야기를 작성해 주세요.</p>
                </div>
                <a class="ds-button light" th:href="@{/community/free}">← 목록으로</a>
            </div>

            <p class="write-error"
               th:if="${error != null}"
               th:text="${error}">
                입력 내용을 확인해 주세요.
            </p>

            <!-- 등록·수정에 따라 전송 주소 변경 -->
            <form class="community-editor detail-container"
                  method="post"
                  th:object="${post}"
                  th:action="${mode == 'write'}
                      ? @{/community/free/write}
                      : @{/community/free/{id}/update(id=${post.postId})}">

                <div class="write-field">
                    <label for="title">제목</label>

                    <input type="text"
                           id="title"
                           th:field="*{title}"
                           maxlength="200"
                           placeholder="제목을 입력해 주세요."
                           required>
                </div>

                <div class="write-field">
                    <label for="content">내용</label>

                    <textarea id="content"
                              th:field="*{content}"
                              rows="10"
                              placeholder="내용을 입력해 주세요."
                              required></textarea>
                </div>

                <div class="post-actions">
                    <a class="community-button cancel-button"
                       th:href="@{/community/free}">
                        취소
                    </a>

                    <button type="submit"
                            class="community-button"
                            th:text="${mode == 'write'} ? '등록' : '수정 완료'">
                        등록
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>

</body>
</html>
