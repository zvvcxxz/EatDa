<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>자유 이야기 상세 · 잇다</title>
</head>

<body>

<th:block layout:fragment="css">
    <!-- 새 커뮤니티 디자인 -->
    <link rel="stylesheet" th:href="@{/dist/css/community-free.css}">
    <link rel="stylesheet" th:href="@{/dist/css/community-board.css}">
    
    
</th:block>

<div layout:fragment="content" class="community-orange community-design">
    <section class="hero-banner"><div class="hero-card"><div><span class="hero-tag">✨ 함께하는 주방</span><h1 class="hero-title">한 끼를 나누고, 맛있는 일상을 잇다.</h1><p class="hero-sub">직접 만든 레시피부터 따라 만든 한 접시까지, 함께 나누어요.</p></div></div></section>
<div class="main-wrapper">

        <aside class="sidebar">
            <h2 class="sidebar-title">COMMUNITY</h2>
            <ul class="sidebar-menu">
                <li class="sidebar-item active">
                    <a th:href="@{/community/free}">💬 자유 이야기</a>
                </li>
                <li class="sidebar-item">
                    <a th:href="@{/community/recipes}">🍳 모두의 레시피</a>
                </li>
                <li class="sidebar-item">
                    <a th:href="@{/community/cooking}">📸 따라 만든 요리</a>
                </li>
                <li class="sidebar-item">
                    <a th:href="@{/community/questions}">🙋‍♀️ 요리 질문</a>
                </li>
            </ul>
            <div class="sidebar-footer-text">
                각자의 한 끼가 모여<br>
                우리의 따뜻한 주방이 됩니다.
            </div>
        </aside>

        <div class="content-area">
            <div class="ds-heading compact">
                <div>
                    <p class="ds-eyebrow">FREE TALK / 상세보기</p>
                    <h2>자유 이야기</h2>
                    <p>함께 나누는 요리와 일상의 이야기</p>
                </div>
                <a class="ds-button light"
                   th:href="@{/community/free(page=${page}, schType=${schType}, kwd=${kwd})}">← 목록으로</a>
            </div>

            <article class="detail-container">
		    <div class="detail-header">
		        <h1 class="detail-title" th:text="${post.title}">게시글 제목</h1>
		
		        <div class="detail-info">
		            <span th:text="${post.authorName}">작성자</span>
		            · <span th:text="${post.createdAt}">작성일</span>
		            · <span th:text="|조회 ${post.viewCount}|">조회 0</span>
		        </div>
		    </div>
		
		    <div class="detail-body" th:text="${post.content}">
		        게시글 내용
		    </div>
		
		    <!-- 좋아요는 본문 아래 가운데 배치 -->
		    <div class="like-box">
		        <button type="button"
		                class="btn-like btnSendBoardLike" th:classappend="${liked} ? 'active' : ''"
		                th:attr="data-liked=${liked},
		                         aria-pressed=${liked},
		                         data-url=@{/community/free/like/{id}(id=${post.postId})}">
		            <span class="like-label"
		                  th:text="${liked} ? '♥ 좋아요' : '♡ 좋아요'">
		                ♡ 좋아요
		            </span>
		            <span id="boardLikeCount" th:text="${post.likeCount}">0</span>
		        </button>
		    </div>
		
		    <!-- 작성자·관리자에게 필요한 버튼만 표시 -->
		    <div class="post-actions"
		         th:if="${owner or #authorization.expression('hasRole(''ADMIN'')')}">
		
		        <th:block th:if="${owner}">
		            <a class="community-button"
		               th:href="@{/community/free/{id}/update(id=${post.postId})}">
		                수정
		            </a>
		
		            <form method="post"
		                  th:action="@{/community/free/{id}/delete(id=${post.postId})}"
		                  data-community-confirm="게시글을 삭제할까요?">
		                <button type="submit" class="community-button delete-button">
		                    삭제
		                </button>
		            </form>
		        </th:block>
		
		        <form sec:authorize="hasRole('ADMIN')" method="post"
		              th:action="@{/community/free/{id}/hide(id=${post.postId})}"
		              data-community-confirm="게시글을 숨길까요?">
		            <button type="submit" class="community-button">숨김</button>
		        </form>
		    </div>
		
		    <!-- 별도 상자 없이 구분선으로 표시 -->
		    <div class="post-nav">
		        <div>
		            <strong class="post-nav-label">이전글</strong>
		            <a th:if="${prevPost != null}"
		               th:text="${prevPost.title}"
		               th:href="@{/community/free/{id}(
		                        id=${prevPost.postId}, page=${page},
		                        schType=${schType}, kwd=${kwd})}">
		                제목
		            </a>
		            <span th:if="${prevPost == null}">이전글이 없습니다.</span>
		        </div>
		
		        <div>
		            <strong class="post-nav-label">다음글</strong>
		            <a th:if="${nextPost != null}"
		               th:text="${nextPost.title}"
		               th:href="@{/community/free/{id}(
		                        id=${nextPost.postId}, page=${page},
		                        schType=${schType}, kwd=${kwd})}">
		                제목
		            </a>
		            <span th:if="${nextPost == null}">다음글이 없습니다.</span>
		        </div>
		    </div>


            <!-- 같은 community 폴더의 댓글 화면 불러오기 -->
            <div class="reply-session"
                 th:attr="data-posts-url=@{/community/free/{id}/comments(id=${post.postId})}">
                <th:block th:replace="~{community/communityReplyContent :: replyContent}">
                </th:block>
            </div>
            </article>
        </div>

    </div>
</div>

<th:block layout:fragment="script">
    <!-- 공통 요청 → 목록 출력 → 이벤트 처리 순서 -->
    <script th:src="@{/dist/js/util-async.js}"></script>
    <script th:src="@{/dist/posts/communityRenderReply.js}"></script>
    <script th:src="@{/dist/posts/communityReplyContent.js}"></script>

    <script th:src="@{/dist/js/community-post-article.js}"></script>

    
</th:block>

</body>
</html>
