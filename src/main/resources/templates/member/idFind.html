<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>아이디 찾기 - 잇다 (EAT-DA)</title>
    <link rel="stylesheet" th:href="@{/css/member/common.css}" />
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-container find-page">

        <div class="common-card find-card">

            <!-- 아이디 찾기 영역 -->
            <section class="find-section">
                <div class="common-header">
                    <h1>아이디 <span>찾기</span></h1>
                    <p>가입 시 등록한 이름과 이메일을 입력하세요.</p>
                </div>

                <form name="idForm" method="post" onsubmit="return false;">
                    <div class="input-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required>
                    </div>

                    <div class="input-group" style="margin-top: 12px;">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="email" placeholder="example@eatda.com" required>
                    </div>

                    <button type="button" class="btn-submit" onclick="idFind();">아이디 찾기</button>

                    <!-- 아이디 찾기 결과 출력 영역 -->
                    <div id="findIdResult" class="result-area"></div>
                </form>
            </section>

            <!-- 서버 메시지 안내 영역 -->
            <div class="message-area" th:if="${message != null}">
                <i class="bi bi-info-circle-fill"></i>
                <span th:text="${message}">안내 메시지</span>
            </div>

        </div>
    </div>
</th:block>

<th:block layout:fragment="script">
    <script th:src="@{/js/idpwdfind.js}"></script>
</th:block>

</body>
</html>
