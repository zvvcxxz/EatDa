<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>패스워드 찾기 - 잇다 (EAT-DA)</title>
    <link rel="stylesheet" th:href="@{/css/member/common.css}" />
</head>
<body>

<th:block layout:fragment="content">
    <div class="page-container">
        <div class="common-card find-card">
            
            <div class="common-header">
                <h1>패스워드 찾기</h1>
                <p>가입 시 등록한 아이디와 이름을 입력해 주세요.</p>
            </div>

            <!-- POST 전송 (Spring Security CSRF 자동 포함) -->
            <form name="pwdForm" th:action="@{/member/pwdFind}" method="post">
                <div class="input-group">
                    <label for="login_id">아이디</label>
                    <input type="text" id="login_id" name="login_id" placeholder="아이디 입력" autofocus required>
                </div>

                <div class="input-group" style="margin-top: 12px;">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" placeholder="이름 입력" required>
                </div>

                <!-- 결과 메시지 영역 (검증 실패 시 표시) -->
                <div class="message-area" th:if="${message != null}" style="color: #e53e3e; margin-top: 10px;">
                    <p th:utext="${message}"></p>
                </div>

                <button type="button" class="btn-submit" onclick="sendOk()" style="margin-top: 15px;">임시 비밀번호 발급</button>
                
                <button type="button" class="btn-sub" style="width: 100%; height: 44px; margin-top: 8px;" 
                        th:onclick="|location.href='@{/member/login}'|">로그인으로 이동</button>
            </form>

        </div>
    </div>
</th:block>

<th:block layout:fragment="script">
    <script th:src="@{/js/idpwdfind.js}"></script>
</th:block>

</body>
</html>
