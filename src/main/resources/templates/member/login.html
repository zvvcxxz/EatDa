<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <link rel="stylesheet" th:href="@{/css/member/common.css}" />
</head>
<body>
<th:block layout:fragment="content">
    <div class="page-container">
        <div class="common-card login-card">

            <div class="common-header">
                <h1>회원 로그인</h1>
                <p>잇다(EAT-DA)에 오신 것을 환영합니다.</p>
            </div>

            <!-- Spring Security 로그인 폼 -->
            <form name="loginForm" th:action="@{/member/login}" method="post" class="login-form">
                
                <div class="input-group">
                    <label for="login_id">아이디</label>
                    <input type="text" id="login_id" name="login_id" placeholder="아이디를 입력하세요" autofocus required>
                </div>

                <div class="input-group" style="margin-top: 12px;">
                    <label for="password">패스워드</label>
                    <input type="password" id="password" name="password" placeholder="패스워드를 입력하세요" autocomplete="off" required>
                </div>

                <div style="margin-top: 12px;">
                    <label class="checkbox-label" for="rememberMe">
                        <input type="checkbox" id="rememberMe">
                        <span>아이디 저장</span>
                    </label>
                </div>

                <button type="button" class="btn-submit" onclick="sendLogin()">로그인</button>

                <div class="message-area" th:if="${param.error != null or message != null}">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span th:text="${message != null ? message : '아이디 또는 패스워드가 일치하지 않습니다.'}">아이디 또는 패스워드가 일치하지 않습니다.</span>
                </div>

                <div class="social-divider">
                    <span>SNS 계정으로 간편 로그인</span>
                </div>

                <!-- 전체 버튼 클릭 시 카카오 로그인 동작 -->
                <div class="social-login-group">
                    <a href="javascript:void(0);" onclick="loginWithKakao(event)" class="btn-social btn-kakao">
                        <i class="bi bi-chat-fill"></i> 카카오
                    </a>
                </div>

                <div class="page-links">
                    <a th:href="@{/member/idFind}">아이디 찾기</a>
                    <span class="divider">|</span>
                    <a th:href="@{/member/pwdFind}">패스워드 찾기</a>
                    <span class="divider">|</span>
                    <a th:href="@{/member/account}">회원가입</a>
                </div>

            </form>

        </div>
    </div>
</th:block>

<th:block layout:fragment="script">
    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function() {
            const savedId = localStorage.getItem("savedLoginId");
            if (savedId) {
                document.loginForm.login_id.value = savedId;
                document.getElementById("rememberMe").checked = true;
            }
        });

        function sendLogin() {
            const f = document.loginForm;

            if (!f.login_id.value.trim()) {
                alert("아이디를 입력하세요.");
                f.login_id.focus();
                return;
            }

            if (!f.password.value.trim()) {
                alert("패스워드를 입력하세요.");
                f.password.focus();
                return;
            }
            const rememberMeChk = document.getElementById("rememberMe").checked;
            if (rememberMeChk) {
                localStorage.setItem("savedLoginId", f.login_id.value.trim());
            } else {
                localStorage.removeItem("savedLoginId");
            }

            f.submit();
        }
        
        function loginWithKakao(e) {
            if (e) e.preventDefault();
            
            const JAVASCRIPT_KEY = '카카오js키';
            const REDIRECT_URI = window.location.origin + '/oauth/kakao/callback';
            
            const kakaoAuthUrl = `https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=${JAVASCRIPT_KEY}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&prompt=login`;
            const setting = 'width=500,height=700,menubar=no,location=no,status=no,scrollbars=yes,resizable=no';
            
            window.open(kakaoAuthUrl, 'kakaoLogin', setting);
        }
    </script>
</th:block>

</body>
</html>
