<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>패스워드 변경</title>
    <link rel="stylesheet" th:href="@{/css/member/common.css}" />
</head>
<body>

<th:block layout:fragment="content">
    <div class="page-container">
        <div class="common-card pwd-card">
            
            <div class="common-header">
                <h1>패스워드 변경</h1>
                <p>안전한 서비스 이용을 위해 새 비밀번호를 설정해 주세요.</p>
            </div>

            <form name="pwdForm" th:action="@{/member/updatePwd}" method="post">
                <div class="input-group">
                    <label for="login_id">아이디</label>
                    <input type="text" id="login_id" name="login_id" 
                           th:value="${#authentication.principal.username}" readonly>
                </div>

                <div class="input-group" style="margin-top: 12px;">
                    <label for="password">새 비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="5~10자 (숫자/특수문자 포함)" autocomplete="off" autofocus required>
                </div>

                <div class="input-group" style="margin-top: 12px;">
                    <label for="password2">비밀번호 확인</label>
                    <input type="password" id="password2" name="password2" placeholder="새 비밀번호 재입력" autocomplete="off" required>
                </div>

                <p class="profile-help-text" style="margin-top: 8px;">
                    ※ 5~10자 이내의 하나 이상의 숫자나 특수문자가 포함되어야 합니다.
                </p>

                <div class="message-area" th:if="${message != null}" style="color: #e53e3e;">
                    <p th:utext="${message}"></p>
                </div>

                <button type="button" class="btn-submit" onclick="sendOk()">비밀번호 변경 완료</button>
                <button type="button" class="btn-sub" style="width: 100%; height: 44px; margin-top: 8px;" th:onclick="|location.href='@{/}'|">다음에 변경</button>
            </form>

        </div>
    </div>
</th:block>

<th:block layout:fragment="script">
    <script th:inline="javascript">
    function sendOk() {
        const f = document.pwdForm;
        if (!f.password.value.trim()) {
            alert('새 패스워드를 입력하세요.');
            f.password.focus();
            return;
        }

        const p = /^(?=.*[a-z])(?=.*[!@#$%^*+=-]|.*[0-9]).{5,10}$/i;
        if (!p.test(f.password.value)) { 
            alert('패스워드는 5~10자 이내이며 하나 이상의 숫자나 특수문자가 포함되어야 합니다.');
            f.password.focus();
            return;
        }

        if (f.password.value !== f.password2.value) {
            alert('패스워드가 일치하지 않습니다.');
            f.password2.focus();
            return;
        }

        f.submit();
    }
    </script>
</th:block>
</body>
</html>
