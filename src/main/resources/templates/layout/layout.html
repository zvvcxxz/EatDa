<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잇다 (EAT-DA)</title>
 <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"><meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&amp;family=Outfit:wght@400;600;800&amp;display=swap">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link rel="stylesheet" th:href="@{/dist/css/common.css}"><link rel="stylesheet" th:href="@{/dist/css/home.css}"><link rel="stylesheet" th:href="@{/dist/css/community.css}">
 <link rel="stylesheet" th:href="@{/dist/css/login-modal.css}">
 <th:block layout:fragment="css"></th:block>
</head>
<body class="eatda-layout">
 <header th:replace="~{fragments/header :: header}"></header>
 <th:block layout:fragment="content"></th:block>
 <footer th:replace="~{fragments/footer :: footer}"></footer>
 <!-- 로그인 UI는 독립 프래그먼트에서 한 번만 조립 -->
 <th:block th:replace="~{fragments/loginModal :: loginModal}"></th:block>
 <div id="site-toast" class="toast" role="status" hidden></div>
 <script type="module" th:src="@{/dist/js/common.js}"></script>
 <script defer th:src="@{/dist/js/login-modal.js}"></script>
 <th:block layout:fragment="script"></th:block>
</body></html>
