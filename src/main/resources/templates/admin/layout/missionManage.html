<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout/layout3}">
      
<th:block layout:fragment="css">
	<link rel="stylesheet" th:href="@{/dist/css/admin-dashboard.css}">
</th:block>
  	  
<th:block layout:fragment="content">
	<div class="admin-wrap">
		<section class="page-heading">
			<div>
				<p class="eyebrow">MISSION MANAGEMENT</p>
				<h2>미션 관리</h2>
				<p class="subtitle">회원들이 함께 도전할 새로운 미션을 만들어보세요.</p>
			</div>
		</section>

		<section class="panel">
			<div class="panel-head">
				<div><h2>미션 목록</h2></div>
				<button type="button" class="custom-btn primary" data-open="mission-dialog">+ 미션 등록</button>
			</div>
			<div class="table-wrap">
				<table>
					<thead><tr><th>미션명</th><th>기간</th><th>참여</th><th>보상</th><th>상태</th></tr></thead>
					<tbody id="admin-mission-rows">
						<!-- DB에서 미션 리스트를 받아와 출력 -->
						<tr th:each="dto : ${list}">
							<td class="cell-title" th:text="${dto.title}">미션명</td>
							<td class="muted" th:text="${dto.startDate + ' ~ ' + dto.endDate}">기간</td>
							<td th:text="${dto.participants + '명'}">0명</td>
							<td th:text="${dto.reward + 'P'}">100P</td>
							<!-- 상태에 따라 뱃지 변경 로직 -->
							<td><span class="custom-badge" th:classappend="${dto.status == 1 ? 'orange' : 'gray'}" th:text="${dto.status == 1 ? '진행중' : '종료'}">상태</span></td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</th:block>

<th:block layout:fragment="aside-container">
	<dialog id="mission-dialog">
		<div class="dialog-head">
			<h2>새 미션 등록</h2><button type="button" class="close-btn" data-close>×</button>
		</div>
		<div class="dialog-body">
			<!-- 💡 실제 미션 등록을 처리할 URL을 action에 적어주세요 -->
			<form id="mission-form" class="form-grid" method="post" th:action="@{/admin/mission/write}">
				<label class="field"><span>미션명</span><input type="text" name="title" required></label>
				<label class="field"><span>미션 설명</span><textarea name="description" required></textarea></label>
				<div class="form-row">
					<label class="field"><span>시작일</span><input type="date" name="start" required></label>
					<label class="field"><span>종료일</span><input type="date" name="end" required></label>
				</div>
				<label class="field"><span>보상 포인트</span><input type="number" name="reward" required value="100"></label>
				<button type="submit" class="custom-btn primary full mt-2">미션 등록</button>
			</form>
		</div>
	</dialog>
	
	<div class="toast-popup" id="toast" role="status" aria-live="polite" hidden></div>
</th:block>	

<th:block layout:fragment="script">
	<script th:src="@{/dist/js/admin-dashboard.js}"></script>
</th:block>
</html>
