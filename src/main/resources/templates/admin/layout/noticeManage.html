<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 목록</title>
</head>
<body>
    <h2>공지사항 관리</h2>
    <button type="button" th:onclick="|location.href='@{/admin/notice/write}'|">글쓰기</button>
    
    <table border="1">
        <tr><th>번호</th><th>제목</th><th>작성자</th><th>조회수</th><th>작성일</th></tr>
        <tr th:each="dto : ${list}">
            <td th:text="${dto.noticeId}">1</td>
            <td>
                <a th:href="@{/admin/notice/article(noticeId=${dto.noticeId})}" th:text="${dto.title}">제목입니다</a>
            </td>
            <td th:text="${dto.adminName}">관리자</td>
            <td th:text="${dto.hitCount}">0</td>
            <td th:text="${dto.createdAt}">2026-10-12</td>
        </tr>
    </table>
</body>
</html>
