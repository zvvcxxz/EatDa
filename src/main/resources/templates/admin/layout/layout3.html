<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<!-- (기존 head 내용 동일하여 생략) -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/dist/css/core.css}" type="text/css">
<link rel="stylesheet" th:href="@{/dist/css/main-dash.css}" type="text/css">
<link rel="stylesheet" th:href="@{/dist/css/forms.css}" type="text/css">
<th:block layout:fragment="css"></th:block>
</head>
<body>

<header>
	<!-- 수정된 부분: :: 양옆에 띄어쓰기 추가 -->
	<th:block th:replace="~{admin/layout/header :: header}"></th:block>
</header>

<main class="main-container">
	<!-- 수정된 부분: :: 양옆에 띄어쓰기 추가 -->
	<th:block th:replace="~{admin/layout/left :: leftMenu}"></th:block> 
	<div class="right-panel">
		<div layout:fragment="content"></div>
	</div>
</main>

<th:block layout:fragment="aside-container"></th:block>	

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>	
<script type="text/javascript" th:src="@{/dist/js/core-dash.js}"></script>
<th:block layout:fragment="script"></th:block>	

</body>
</html>
