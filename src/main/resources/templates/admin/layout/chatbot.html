<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>호텔 AI 챗봇</title>

	<link rel="icon" href="data:;base64,iVBORw0KGgo=">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/dist/css/chat.css}">
</head>
<body>

<main class="chat-container">
	<section class="chat-card">
		<header class="chat-header">
			<div class="bot-icon">H</div>
			<div>
				<h1>호텔 AI 챗봇</h1>
				<p>무엇이든 편하게 문의하세요.</p>
			</div>
			<span class="status-badge">온라인</span>
		</header>

		<div class="chat-box" id="chatBox">
			<div class="message assistant">
				<div class="message-content">
					안녕하세요! 호텔 AI 챗봇입니다.
					호텔 이용 및 예약 관련 문의사항을 입력해 주세요.
				</div>
			</div>
		</div>

		<footer class="chat-footer">
			<form id="chatForm" class="chat-form">
				<input
					type="text"
					id="messageInput"
					placeholder="문의사항을 입력하세요..."
					autocomplete="off"
					aria-label="질문 입력"
					required
				>
				<button type="submit" id="sendButton">
					전송
				</button>
			</form>
			<p class="footer-note">
				AI 답변은 참고용이며, 정확한 정보는 호텔에 확인해 주세요.
			</p>
		</footer>

    </section>
</main>

<script>
(() => {
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');

    let isSending = false;

    // HTML 태그가 실행되지 않도록 안전하게 메시지 추가
    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', sender);

        const contentDiv = document.createElement('div');
        contentDiv.classList.add('message-content');
        contentDiv.textContent = text;

        messageDiv.appendChild(contentDiv);
        chatBox.appendChild(messageDiv);

        scrollToBottom();
        return messageDiv;
    }

    function scrollToBottom() {
        chatBox.scrollTo({
            top: chatBox.scrollHeight,
            behavior: 'smooth'
        });
    }

    // 로딩 표시 생성
    function addLoading() {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', 'assistant', 'loading-message');

        messageDiv.innerHTML = `
            <div class="message-content loading-content">
                <span>답변 생성 중</span>
                <span class="typing-dots" aria-label="로딩 중">
                    <i></i><i></i><i></i>
                </span>
            </div>
        `;

        chatBox.appendChild(messageDiv);
        scrollToBottom();

        return messageDiv;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const question = messageInput.value.trim();

        if (!question || isSending) {
            return;
        }

        isSending = true;
        sendButton.disabled = true;
        messageInput.disabled = true;

        addMessage(question, 'user');
        messageInput.value = '';

        // 질문 직후 로딩 표시
        const loadingElement = addLoading();

        try {
            const response = await fetch(
                `/api/question?question=${encodeURIComponent(question)}`
            );

            if (!response.ok) {
                throw new Error(`HTTP error: ${response.status}`);
            }

            if (!response.body) {
                throw new Error('응답 스트림을 사용할 수 없습니다.');
            }

            // 답변 수신이 시작되면 로딩 표시를 답변 영역으로 교체
            const botMessageElement = document.createElement('div');
            botMessageElement.classList.add('message', 'assistant');

            const contentElement = document.createElement('div');
            contentElement.classList.add('message-content');

            botMessageElement.appendChild(contentElement);
            loadingElement.replaceWith(botMessageElement);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            // 스트리밍 텍스트를 안전하게 표시하면서 타자 효과 적용
            async function appendTextWithTypingEffect(text) {
                for (const ch of text) {
                    contentElement.appendChild(
                        document.createTextNode(ch)
                    );

                    scrollToBottom();

                    await new Promise(resolve => setTimeout(resolve, 10));
                }
            }

            while (true) {
                const { done, value } = await reader.read();

                if (done) {
                    break;
                }

                const chunk = decoder.decode(value, { stream: true });

                if (chunk) {
                    await appendTextWithTypingEffect(chunk);
                }
            }

            // 스트림 마지막에 남아 있는 디코더 데이터 처리
            const remaining = decoder.decode();

            if (remaining) {
                await appendTextWithTypingEffect(remaining);
            }

            // 빈 응답 처리
            if (!contentElement.textContent.trim()) {
                contentElement.textContent = '답변을 가져오지 못했습니다. 다시 시도해 주세요.';
            }

        } catch (error) {
            console.error('Chat error:', error);

            loadingElement.remove();

            addMessage(
                '답변을 가져오는 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.',
                'assistant'
            );

        } finally {
            isSending = false;
            sendButton.disabled = false;
            messageInput.disabled = false;
            messageInput.focus();
        }
    });
})();
</script>

</body>
</html>
