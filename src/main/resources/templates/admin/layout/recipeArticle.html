<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout3}">

<th:block layout:fragment="css">
	<link rel="stylesheet" th:href="@{/dist/css/admin-dashboard.css(v=20261103-3)}">
</th:block>

<th:block layout:fragment="content">
    <div class="admin-wrap admin-view-recipearticle">
        <section class="page-heading">
            <div onclick="location.href='/admin/recipe/list'" class="view-recipearticle-1">
                <p class="eyebrow">RECIPE DETAIL</p>
                <h2>레시피 상세 보기</h2>
                <p class="subtitle">등록된 레시피의 상세 정보를 확인하고 게시 상태를 관리해요.</p>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head">
                <div>
                    <h2 th:text="${dto.title}">레시피 제목</h2>
                    <p>레시피 ID: #[[${dto.recipeId}]]</p>
                </div>
                <div>
                    
                    <span class="custom-badge gray">모두의 레시피</span>
                </div>
            </div>

            <div class="panel-body">
                <div class="profile-grid">
                    <strong>레시피 번호</strong>
                    <span th:text="${dto.recipeId}">1</span>

                    <strong>출처</strong>
                    <span>회원 작성</span>

                    <strong>작성자</strong>
                    <span th:text="${dto.userName != null ? dto.userName : dto.loginId}">홍길동</span>

                    <strong>등록일</strong>
                    <span class="muted" th:text="${dto.createdAt}">2026-10-16</span>

                    <strong>조리 시간</strong>
                    <span th:text="${dto.cookMinutes != null ? dto.cookMinutes + '분' : '-'}">-</span>

                    <strong>난이도 / 인원</strong>
                    <span th:text="${(dto.difficulty != null ? dto.difficulty : '-') + ' / ' + (dto.servings != null ? dto.servings + '인분' : '-')}">-</span>

                    <strong>현재 상태</strong>
                    <div>
                        <span class="custom-badge green" th:if="${dto.status == 0}">정상 (표시 중)</span>
                        <span class="custom-badge red" th:if="${dto.status == 1}">숨김 처리됨</span>
                    </div>

                    <strong>비고/사유</strong>
                    <span class="muted" th:text="${dto.blindReason != null ? dto.blindReason : '특이사항 없음'}">특이사항 없음</span>

                    <strong class="view-recipearticle-2">요약 정보</strong>
                    <span th:text="${dto.summary != null ? dto.summary : '등록된 요약 정보가 없습니다.'}" class="view-recipearticle-3">요약 내용</span>
                </div>

                <div class="profile-footer view-recipearticle-4">
                    <form th:action="@{/admin/recipe/updateStatus}" method="post" class="view-recipearticle-5">
                        <input type="hidden" name="recipeId" th:value="${dto.recipeId}">
                        <input type="hidden" name="page" th:value="${page}">
                        <input type="hidden" name="schType" th:value="${schType}">
                        <input type="hidden" name="kwd" th:value="${kwd}">
                        <input type="hidden" name="sourceType" th:value="${sourceType}">
                        
                        <input type="hidden" name="status" th:value="${dto.status == 0 ? 1 : 0}">

                        <button type="submit" 
                                class="custom-btn"
                                th:classappend="${dto.status == 0 ? 'danger' : 'primary'}"
                                th:text="${dto.status == 0 ? '이 레시피 숨김 처리' : '숨김 해제 및 표시'}"
                                onclick="return confirm('이 레시피의 공개 상태를 변경하시겠습니까?');">
                            상태 변경
                        </button>
                    </form>

                    <div class="btn-group">
                        <button type="button" class="custom-btn secondary"
                                th:onclick="|location.href='@{/admin/recipe/list(page=${page}, schType=${schType}, kwd=${kwd}, sourceType=${sourceType})}'|">
                            목록으로
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="aside-container">
    <div class="toast-popup" id="toast" role="status" aria-live="polite" hidden></div>
</th:block>

<th:block layout:fragment="script">
    <script th:src="@{/dist/js/admin-dashboard.js}"></script>
    <script th:src="@{/dist/js/admin-recipe.js}"></script>
</th:block>
</html>
