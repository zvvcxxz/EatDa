<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout/layout3}">

<th:block layout:fragment="content">
    
    <div class="body-container">
        <div class="body-title">
            <h3><i class="bi bi-book"></i> 레시피 관리</h3>
        </div>
        
        <div class="body-main">
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tab-all" data-source="" type="button" role="tab">전체 레시피</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-api" data-source="API" type="button" role="tab">공식 레시피</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-member" data-source="MEMBER" type="button" role="tab">모두의 레시피</button>
                </li>
            </ul>
            
            <div class="tab-content pt-3">
                
                <div class="row board-list-header">
				    <div class="col-auto me-auto">
				        <p class="form-control-plaintext">데이터 <span style="font-weight: 600; color: #0d6efd;" th:text="${dataCount}">0</span>개 
				        (<span th:text="${page}">1</span>/<span th:text="${total_page}">1</span> 페이지)</p>
				    </div>
                    <div class="col-auto text-end">
                        <form name="searchForm" class="d-flex justify-content-end">
                            <select name="schType" class="form-select form-select-sm" style="width: 130px; margin-right: 5px;">
                                <option value="title">레시피 제목</option>
                                <option value="userName">작성자</option>
                            </select>
                            <input type="text" name="kwd" class="form-control form-control-sm" style="width: 200px; margin-right: 5px;">
                            <button type="button" class="btn btn-sm btn-outline-secondary">검색</button>
                        </form>
                    </div>
                </div>
                
                <table class="table table-hover board-list text-center" style="margin-top: 15px;">
                    <thead class="table-light">
                        <tr>
                            <th width="80">번호</th>
                            <th width="100">출처</th>
                            <th>제목</th>
                            <th width="120">작성자</th>
                            <th width="100">조회수</th>
                            <th width="150">등록일</th>
                            <th width="100">상태</th>
                            <th width="100">관리</th>
                        </tr>
                    </thead>
					<tbody id="listData">
					    <tr th:if="${#lists.isEmpty(list)}">
					        <td colspan="8" class="text-center" style="padding: 50px 0;">
					            등록된 레시피가 존재하지 않습니다.
					        </td>
					    </tr>
					    
					    <tr th:each="dto : ${list}">
					        <td th:text="${dto.recipeId}">1</td>
					        <td>
					            <span class="badge" 
					                  th:classappend="${dto.sourceType == 'API' ? 'bg-primary' : 'bg-secondary'}"
					                  th:text="${dto.sourceType == 'API' ? '공식' : '유저'}">출처</span>
					        </td>
					        
					        <td class="text-start">
					            <a th:href="@{/admin/recipe/article(recipeId=${dto.recipeId}, page=${page}, schType=${schType}, kwd=${kwd}, sourceType=${sourceType})}" 
					               th:text="${dto.title}" 
					               class="text-decoration-none text-reset" style="font-weight: 500;">레시피 제목</a>
					        </td>
					        
					        <td th:text="${dto.userName != null ? dto.userName : dto.loginId}">홍길동</td>
					        
					        <td th:text="${dto.viewCount}">0</td>
					        <td th:text="${dto.createdAt}">2026-10-15</td>
					        <td>
					            <span th:if="${dto.status == 1}" class="text-success">정상</span>
					            <span th:if="${dto.status == 0}" class="text-danger">숨김</span>
					        </td>
					        
					        <td>
					            <a th:href="@{/admin/recipe/article(recipeId=${dto.recipeId}, page=${page}, schType=${schType}, kwd=${kwd}, sourceType=${sourceType})}" 
					               class="btn btn-sm btn-outline-secondary">상세</a>
					        </td>
					    </tr>
					</tbody>
                </table>
                
                <div class="page-navigation text-center">
                    페이징
                </div>

            </div>
        </div>
    </div>

</th:block>
</html>
