<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout/layout3}">
      
<th:block layout:fragment="css">
	<link rel="stylesheet" th:href="@{/dist/css/admin-dashboard.css}">
</th:block>
  	  
<th:block layout:fragment="content">
	<div class="admin-wrap">
		<section class="page-heading">
			<div>
				<p class="eyebrow">RECIPE MANAGEMENT</p>
				<h2>레시피 관리</h2>
				<p class="subtitle">등록된 레시피의 공개 상태를 관리해요.</p>
			</div>
		</section>

		<section class="panel">
			<div class="panel-head">
				<div><h2>전체 레시피 목록</h2></div>
				<input class="search-input" type="search" placeholder="레시피 이름 검색" data-search="recipe-rows">
			</div>
			<div class="table-wrap">
				<table>
					<thead><tr><th>레시피</th><th>작성자</th><th>작성일</th><th>상태</th><th>관리</th></tr></thead>
					<tbody id="recipe-rows">
						<tr th:each="dto : ${list}" th:data-search-text="${dto.title}">
							<td class="cell-title" th:text="${dto.title}">레시피명</td>
							<td th:text="${dto.writer}">작성자</td>
							<td class="muted" th:text="${dto.reg_date}">등록일</td>
							<td><span class="custom-badge green">공개</span></td>
							<td><button type="button" class="custom-btn secondary small">숨김</button></td>
						</tr>
					</tbody>
				</table>
			</div>
			<p class="empty" data-empty-for="recipe-rows" hidden>검색 결과가 없습니다.</p>
		</section>
	</div>
</th:block>

<th:block layout:fragment="aside-container">
	<div class="toast-popup" id="toast" role="status" aria-live="polite" hidden></div>
</th:block>	

<th:block layout:fragment="script">
	<script th:src="@{/dist/js/admin-dashboard.js}"></script>
</th:block>
</html>
