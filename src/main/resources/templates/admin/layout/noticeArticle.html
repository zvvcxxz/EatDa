<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout/layout3}">

<th:block layout:fragment="content">
    
    <div class="body-container">
        <div class="body-title">
            <h3><i class="bi bi-book"></i> 레시피 상세 보기</h3>
        </div>
        
        <div class="body-main pt-3">
            <table class="table table-bordered align-middle">
                <tbody>
                    <tr>
                        <th class="table-light text-center" style="width: 15%;">레시피 번호</th>
                        <td style="width: 35%;" th:text="${dto.recipeId}"></td>
                        <th class="table-light text-center" style="width: 15%;">출처</th>
                        <td style="width: 35%;">
                            <span class="badge" 
                                  th:classappend="${dto.sourceType == 'API' ? 'bg-primary' : 'bg-secondary'}"
                                  th:text="${dto.sourceType == 'API' ? '공식' : '유저'}">출처</span>
                        </td>
                    </tr>
                    <tr>
                        <th class="table-light text-center">작성자</th>
                        <td th:text="${dto.userName != null ? dto.userName : dto.loginId}"></td>
                        <th class="table-light text-center">등록일</th>
                        <td th:text="${dto.createdAt}"></td>
                    </tr>
                    <tr>
                        <th class="table-light text-center">조리 시간</th>
                        <td th:text="${dto.cookMinutes != null ? dto.cookMinutes + '분' : '-'}"></td>
                        <th class="table-light text-center">난이도 / 인원</th>
                        <td th:text="${(dto.difficulty != null ? dto.difficulty : '-') + ' / ' + (dto.servings != null ? dto.servings + '인분' : '-')}"></td>
                    </tr>
                    <tr>
                        <th class="table-light text-center">현재 상태</th>
                        <td colspan="3">
                            <span th:if="${dto.status == 1}" class="text-success fw-bold">정상 (표시 중)</span>
                            <span th:if="${dto.status == 0}" class="text-danger fw-bold">숨김 처리됨</span>
                        </td>
                    </tr>
                    <tr>
                        <th class="table-light text-center">요약 정보</th>
                        <td colspan="3" th:text="${dto.summary != null ? dto.summary : '-'}"></td>
                    </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between mt-4">
                <form th:action="@{/admin/recipe/updateStatus}" method="post">
                    <input type="hidden" name="recipeId" th:value="${dto.recipeId}">
                    <input type="hidden" name="page" th:value="${page}">
                    <input type="hidden" name="schType" th:value="${schType}">
                    <input type="hidden" name="kwd" th:value="${kwd}">
                    <input type="hidden" name="sourceType" th:value="${sourceType}">
                    
                    <input type="hidden" name="status" th:value="${dto.status == 1 ? 0 : 1}">
                    
                    <button type="submit" class="btn" 
                            th:classappend="${dto.status == 1 ? 'btn-danger' : 'btn-success'}"
                            th:text="${dto.status == 1 ? '이 레시피 숨김 처리' : '숨김 해제 및 표시'}"
                            onclick="return confirm('이 레시피의 상태를 변경하시겠습니까?');">
                    </button>
                </form>

                <button type="button" class="btn btn-outline-secondary" 
                        th:onclick="|location.href='@{/admin/recipe/list(page=${page}, schType=${schType}, kwd=${kwd}, sourceType=${sourceType})}'|">목록</button>
            </div>
        </div>
    </div>

</th:block>
</html>
