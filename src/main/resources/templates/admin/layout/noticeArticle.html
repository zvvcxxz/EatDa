<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout/layout3}">

<th:block layout:fragment="css">
	<link rel="stylesheet" th:href="@{/dist/css/admin-dashboard.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="admin-wrap">
s        <section class="page-heading">
            <div>
                <p class="eyebrow">NOTICE DETAILS</p>
                <h2>공지사항 상세</h2>
                <p class="subtitle">등록된 공지사항의 상세 내용을 확인합니다.</p>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head article-head-info" style="display: flex;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span th:if="${dto.pinnedYn == 'Y'}" class="custom-badge red">공지</span>
                    <span th:if="${dto.status == 0}" class="custom-badge gray">숨김</span>
                    <h3 class="article-title" th:text="${dto.title}">공지사항 제목</h3>
                </div>
                
                <div class="article-meta" style="margin-top: 10px;">
                    <strong th:text="${dto.adminName}">관리자명</strong>
                    <span class="divider">|</span>
                    <span th:text="${dto.createdAt}">등록일</span>
                    <span class="divider">|</span>
                    <span>조회 <span th:text="${dto.hitCount}">0</span></span>
                </div>
            </div>
            
            <div class="panel-body">
                <div class="article-content" th:text="${dto.content}">
                    공지사항 내용
                </div>

                <div class="article-attachments" th:if="${not #lists.isEmpty(listFile)}">
                    <h3><i class="bi bi-paperclip"></i> 첨부파일</h3>
                    <div class="tag-list">
                        <span class="tag-item" th:each="file : ${listFile}">
                            <i class="bi bi-file-earmark-text" style="color: var(--orange);"></i>
                            <span th:text="${file.originalFileName}">첨부파일.jpg</span>
                        </span>
                    </div>
                </div>

                <div class="article-footer">
                    <div>
                        <button type="button" class="custom-btn secondary" th:onclick="|location.href='@{/admin/notice/update(noticeId=${dto.noticeId})}'|">수정</button>
                        <button type="button" class="custom-btn danger" th:onclick="|if(confirm('이 공지사항을 삭제하시겠습니까?')) location.href='@{/admin/notice/delete(noticeId=${dto.noticeId})}'|">삭제</button>
                    </div>
                    <button type="button" class="custom-btn primary" th:onclick="|location.href='@{/admin/notice/list}'|">목록으로</button>
                </div>
            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="script">
	<script th:src="@{/dist/js/admin-dashboard.js}"></script>
</th:block>
</html>
