<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
    <link rel="stylesheet" th:href="@{/css/member/common.css}" />
</head>
<body>
<th:block layout:fragment="content">
	<div class="page-container">
		<div class="common-card complete-card" data-aos="fade-up" data-aos-delay="200">
			
			<div class="common-header">
				<h1>파일 업로드 <span>실패</span></h1>
			</div>

			<hr class="common-divider">

			<div class="message-area" style="margin: 30px 0;">
				<p class="text-center" style="margin: 0;">
					<strong>파일을 업로드할 수 없습니다.</strong><br>
					파일의 용량이 초과했거나 권한이 불충분합니다.
				</p>
			</div>
            
			<div>
				<button type="button" class="btn-submit" onclick="javascript:history.back();">
					이전화면으로 이동
				</button>	                    
			</div>

		</div>
	</div>
</th:block>
</body>
</html>
