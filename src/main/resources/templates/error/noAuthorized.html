<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <link rel="stylesheet" th:href="@{/css/member/common.css}" />
</head>
<body>
<th:block layout:fragment="content">
	<div class="page-container">
		<div class="common-card complete-card" data-aos="fade-up" data-aos-delay="200">
			
			<div class="common-header">
				<h1><i class="bi bi-exclamation-triangle"></i> 접근 <span>제한</span></h1>
			</div>

			<hr class="common-divider">

			<div class="message-area" style="margin: 30px 0;">
				<p class="text-center" style="margin: 0;">
					<strong>해당 정보에 접근할 수 있는 권한이 없습니다.</strong><br>
					메인화면으로 이동하시기 바랍니다.
				</p>
			</div>
            
			<div>
				<button type="button" class="btn-submit" th:onclick="|location.href='@{/}'|">
					메인화면으로 이동 <i class="bi bi-arrow-counterclockwise"></i>
				</button>	                    
			</div>

		</div>
	</div>
</th:block>
</body>
</html>
