<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
<title>같이 먹어요 · 잇다</title>
<!-- 메인과 동일한 layout/layout에서 header/footer/loginModal을 한 번만 조립합니다. -->
<th:block layout:fragment="css">
	<link rel="stylesheet" th:href="@{/dist/css/together.css}">
</th:block>
</head>
<body>
	<main layout:fragment="content" class="together-page">
		<p th:if="${message != null}" th:text="${message}" class="tg-message"
			role="status"></p>
		<section class="tg-hero">
			<div class="tg-eyebrow">
				<i class="fa-solid fa-utensils" aria-hidden="true"></i> 잇다 Together
			</div>
			<h1>
				따뜻한 한 끼의 동반자,<br> <span>같이 먹어요</span>
			</h1>
			<p>부담 없이 함께 식사할 이웃을 만나보세요.</p>
		</section>

		<!-- GET /together/meet: model.addAttribute("posts", service 목록 조회 결과).
         DTO 필드는 현재 프로젝트의 snake_case 기준입니다. 빈 목록이면 샘플 대신 안내만 표시합니다.
         name은 MEMBER 조인(AUTHOR_ID = MEMBER_ID) 결과. 삭제/비공개 필터는 반드시 서버 SQL에서 처리.
         statusLabels: 실제 MEET_STATUS 코드별 표시명 Map<Integer,String>, 생략하면 숫자 표시.
         message: RedirectAttributes의 성공/실패 안내. HTML을 직접 삽입하지 않습니다. -->
		<p class="tg-message" role="status" th:if="${message != null}"
			th:text="${message}"></p>
		<div class="tg-toolbar">
			<nav class="tg-tabs" aria-label="Together 게시판">
				<a class="tg-tab is-active" aria-current="page"
					th:href="@{/together/meet}">🍲 같이 먹어요</a> <a class="tg-tab"
					th:href="@{/together/share}">🥕 재료 나눔</a>
			</nav>
			<button type="button" class="tg-button primary" data-open-write>
				<i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> 글쓰기
			</button>
		</div>

		<section class="tg-list" aria-label="같이 먹어요 게시글">
			<p class="tg-empty" th:if="${posts == null or #lists.isEmpty(posts)}">
				등록된 게시글이 없습니다. 첫 글을 작성해 보세요.</p>
			<article class="tg-card" th:each="post : ${posts}">
				<div>
					<div class="tg-card-top">
						<span class="tg-badge">같이 먹어요</span> <span
							class="tg-badge tg-status" th:if="${post.meet_status != null}"
							th:text="${statusLabels != null and statusLabels.containsKey(post.meet_status) ? statusLabels.get(post.meet_status) : '상태 ' + post.meet_status}"></span>
					</div>
					<!-- GET /together/meet/detail/{id}: 상세 컨트롤러를 구현한 뒤 사용합니다. -->
					<a class="tg-title"
						th:href="@{/together/meet/detail/{id}(id=${post.meet_id})}"
						th:text="${post.title}"></a>
					<p class="tg-excerpt" th:text="${post.content}"></p>
					<dl class="tg-meta">
						<div>
							<dt>장소</dt>
							<dd th:text="${post.location_text}"></dd>
						</div>
						<div>
							<dt>모임 일시</dt>
							<dd th:text="${post.meet_at}"></dd>
						</div>
						<div>
							<dt>신청 마감</dt>
							<dd th:text="${post.application_deadline} ?: '별도 마감 없음'"></dd>
						</div>
					</dl>
				</div>
				<div class="tg-card-side">
					<p>
						최대 참여 인원 <strong th:text="${post.max_participants}"></strong>명
					</p>
					<!-- 현재 수락 인원/좋아요 수는 참여자·좋아요 테이블 집계 구현 후 추가.
               임의의 모집 진행률이나 조회수/좋아요 숫자는 표시하지 않습니다. -->
					<div class="tg-author">
						<i class="fa-solid fa-user" aria-hidden="true"></i><span
							th:text="${post.name}"></span>
					</div>
					<p class="tg-date">
						작성 <span th:text="${post.created_at}"></span>
					</p>
					<p class="tg-date">
						조회 <span th:text="${post.view_count}"></span>
					</p>
				</div>
			</article>
		</section>

		<!-- 모달도 content fragment 안에 있어 layout 적용 시 사라지지 않습니다.
         POST /together/meet/write -> DTO 바인딩, 검증, 서비스 저장, redirect:/together/meet.
         author_id/name/status/meet_status는 클라이언트에서 받지 말고 서버 로그인 정보/초기 정책으로 설정.
         @ModelAttribute DTO를 그대로 신뢰하지 말고 허용 필드만 바인딩하거나 요청 전용 DTO를 사용하세요. -->
		<dialog class="tg-dialog" data-write-dialog
			aria-labelledby="meet-write-title">
		<div class="tg-dialog-head">
			<h2 id="meet-write-title">같이 먹어요 글쓰기</h2>
			<button type="button" class="tg-close" data-close-write
				aria-label="글쓰기 닫기">×</button>
		</div>
		<!-- Thymeleaf + Spring Security의 th:action POST 폼은 활성화된 CSRF 토큰을 자동 추가합니다.
           서버에서 렌더링한 form에 _csrf hidden이 있는지 확인하고 CSRF를 끄지 마세요. -->
		<form th:action="@{/together/meet/write}" method="post"
			data-write-form>
			<label class="tg-field">제목 * <input type="text" name="title"
				maxlength="200" required>
			</label> <label class="tg-field">모임 장소 * <input type="text"
				name="location_text" maxlength="300" required>
			</label>

			<div class="tg-form-grid">
				<label class="tg-field">모임 일시 * <input type="datetime-local"
					name="meet_at" data-date required>
				</label> <label class="tg-field">신청 마감 일시 <input
					type="datetime-local" name="application_deadline" data-date>
				</label>
			</div>
			<label class="tg-field">최대 참여 인원 * <input type="number"
				name="max_participants" min="1" max="99999" step="1" required>
			</label> <label class="tg-field">상세 내용 * <textarea name="content"
					rows="5" required></textarea>
			</label>
			<p class="tg-note">* 필수 입력 항목입니다. 등록하려면 로그인이 필요합니다.</p>
			<div class="tg-actions">
				<button type="button" class="tg-button" data-close-write>취소</button>
				<button type="submit" class="tg-button primary">등록하기</button>
			</div>
		</form>
		</dialog>
	</main>
	<th:block layout:fragment="script">
		<script defer th:src="@{/dist/js/together.js}"></script>
	</th:block>
</body>
</html>
