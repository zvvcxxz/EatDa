<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{mykitchen/mykitchenLayout}">
<head>
    <title th:text="${pageTitle} + ' - 나의 주방'">레시피 목록</title>
</head>
<body>

<th:block layout:fragment="kitchenContent">
    <section class="panel">
        <div class="section-heading">
            <h2 th:text="${pageTitle}">레시피 목록</h2>
            <a th:if="${tab == 'mine'}" class="btn btn-primary" th:href="@{/recipes/new}">+ 레시피 작성</a>
        </div>

        <form th:if="${tab != 'recommendations'}" method="get" th:action="@{/kitchen}" class="toolbar">
            <input type="hidden" name="tab" th:value="${tab}">
            <label class="sr-only" for="recipeSort">정렬</label>
            <select name="sort" id="recipeSort">
                <option value="latest" th:selected="${sort == 'latest'}" th:text="${tab == 'favorites' ? '최신 찜 순' : '최신순'}">최신순</option>
                <option value="likes" th:selected="${sort == 'likes'}">좋아요순</option>
            </select>
            <button type="submit" class="btn btn-light">정렬 적용</button>
        </form>

        <div th:if="${tab == 'recommendations'}" class="recommend-description">
            <p class="muted">표준 재료 ID의 일치율이 높은 순으로 추천합니다. 유통기한이 지난 재료는 추천 기준에서 제외됩니다.</p>
            <div class="chip-row">
                <span class="chip selected" th:each="ingredient : ${usedIngredients}" th:text="${ingredient.name}">당근</span>
            </div>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(recipes)}">
            <h3>표시할 레시피가 없어요</h3>
            <p>레시피를 작성하거나 찜해 보세요. 추천에는 사용 가능한 재료가 필요합니다.</p>
        </div>

        <div class="recipe-grid">
            <article class="recipe-card" th:each="recipe : ${recipes}">
                <a class="recipe-image" th:href="@{/recipes/{id}(id=${recipe.id})}">
                    <img th:if="${recipe.imageUrl != null}" th:src="${recipe.imageUrl}" th:alt="${recipe.title}" loading="lazy">
                    <span th:if="${recipe.imageUrl == null}" class="image-placeholder" aria-hidden="true">🍽️</span>
                </a>

                <div class="recipe-body">
                    <div class="badge-group">
                        <span th:if="${recipe.hidden}" class="badge badge-danger">관리자 숨김</span>
                        <span th:if="${!recipe.available}" class="badge badge-old">열람 제한</span>
                        <span th:if="${tab == 'recommendations'}" class="badge badge-success" th:text="|재료 일치 ${recipe.matchRate}%|">재료 일치 80%</span>
                    </div>

                    <h3 th:text="${recipe.title}">당근 볶음밥</h3>
                    <p class="muted">
                        <span th:text="${recipe.createdDate}">2026-01-01</span> · 좋아요 <span th:text="${recipe.likeCount}">0</span>
                    </p>

                    <div th:if="${tab == 'recommendations'}" class="match-info">
                        <p><strong>보유 재료</strong> <span th:text="${#strings.listJoin(recipe.ownedNames, ', ')}">당근, 밥</span></p>
                        <div>
                            <strong>부족 재료</strong>
                            <span th:if="${#lists.isEmpty(recipe.missingIngredients)}">없음</span>
                            <div class="missing-item" th:each="missing : ${recipe.missingIngredients}">
                                <span th:text="${missing.name}">대파</span>
                                <a th:href="@{/shopping(ingredientId=${missing.id})}">장보기</a>
                            </div>
                        </div>
                    </div>

                    <div class="card-actions">
                        <a th:if="${recipe.available}" class="btn btn-light btn-small" th:href="@{/recipes/{id}(id=${recipe.id})}">보기</a>
                        <a th:if="${tab == 'mine'}" class="btn btn-light btn-small" th:href="@{/recipes/{id}/edit(id=${recipe.id})}">수정</a>
                        <button th:if="${tab == 'mine'}" type="button" class="btn btn-danger-light btn-small" data-action="delete-recipe" th:attr="data-id=${recipe.id}">삭제</button>
                        <button th:if="${tab == 'favorites'}" type="button" class="btn btn-danger-light btn-small" data-action="remove-favorite" th:attr="data-id=${recipe.id}" th:aria-label="|${recipe.title} 찜 해제|">♥ 찜 해제</button>
                    </div>
                </div>
            </article>
        </div>
    </section>
</th:block>

</body>
</html>
