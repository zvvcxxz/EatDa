<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{mykitchen/mykitchenLayout}">
<head>
    <title th:text="${pageTitle} + ' - 나의 주방'">레시피 목록</title>
</head>
<body>

<th:block layout:fragment="kitchenContent">
    <section class="panel">
        <div class="section-heading">
            <h4 th:text="${pageDescribe}">내 레시피</h4>
            <a th:if="${tab == 'mine'}" class="btn btn-primary" th:href="@{/community/recipes/write}">+ 레시피 작성</a>
        </div>

		<!-- 정렬 툴바 -->
		<form method="get" th:action="${tab == 'mine' ? '/my/recipes' : '/my/bookmarks'}" class="toolbar">
		    <input type="hidden" name="page" value="1">
		    <label class="sr-only" for="recipeSort">정렬</label>
		    <select name="sort" id="recipeSort" onchange="this.form.submit()">
		        <option value="latest" th:selected="${sort == 'latest'}" 
		                th:text="${tab == 'favorites' ? '최신 찜 순' : '최신순'}">최신순</option>
		        <option value="likes" th:selected="${sort == 'likes'}">좋아요순</option>
		    </select>
		</form>

        <!-- 데이터 없음 상태 -->
        <div class="empty-state" th:if="${#lists.isEmpty(recipes)}">
            <h3>표시할 레시피가 없어요</h3>
            <p th:text="${tab == 'mine' ? '첫 레시피를 만들어 공유해 보세요!' : '마음에 드는 레시피를 찜해 보세요.'}">
                레시피를 작성하거나 찜해 보세요.
            </p>
        </div>

        <!-- 레시피 카드 그리드 -->
        <div class="recipe-grid" th:if="${!#lists.isEmpty(recipes)}">
            <article class="recipe-card" th:each="recipe : ${recipes}">
                <a class="recipe-image" th:href="@{/community/recipes/{id}(id=${recipe.recipeId})}">
                    <img th:if="${recipe.thumbnailUrl != null}" th:src="${recipe.thumbnailUrl}" th:alt="${recipe.title}" loading="lazy">
                    <span th:if="${recipe.thumbnailUrl == null}" class="image-placeholder" aria-hidden="true">🍽️</span>
                </a>

                <div class="recipe-body">
                    <!-- 상태 뱃지 (1: 관리자 숨김, 2: 삭제 상태) -->
                    <div class="badge-group" th:if="${recipe.status != null and recipe.status != 0}">
                        <span th:if="${recipe.status == 1}" class="badge badge-danger">관리자 숨김</span>
                        <span th:if="${recipe.status == 2}" class="badge badge-secondary">삭제됨</span>
                    </div>

                    <h3 class="recipe-title" th:text="${recipe.title}">당근 볶음밥</h3>
                    
                    <p class="muted">
                        <span th:text="${#temporals.format(recipe.createdAt, 'yyyy-MM-dd')}">2026-01-01</span> · 
                        좋아요 <span th:text="${recipe.likeCount}">0</span>
                    </p>

                    <!-- 카드 액션 버튼 -->
                    <div class="card-actions">
                        <!-- 정상(status == 0 또는 null) 상태일 때만 상세 보기 가능 -->
                        <a th:if="${recipe.status == null or recipe.status == 0}" 
                           class="btn btn-light btn-small" 
                           th:href="@{/community/recipes/{id}(id=${recipe.recipeId})}">보기</a>

                        <!-- 내가 작성한 레시피 탭 (수정/삭제) -->
                        <a th:if="${tab == 'mine'}" 
                           class="btn btn-light btn-small" 
                           th:href="@{/community/recipes/{id}/update(id=${recipe.recipeId})}">수정</a>
                        
                        <button th:if="${tab == 'mine'}" 
                                type="button" 
                                class="btn btn-danger-light btn-small" 
                                data-action="delete-recipe" 
                                th:attr="data-id=${recipe.recipeId}">삭제</button>

                        <!-- 찜한 레시피 탭 (찜 해제) -->
                        <button th:if="${tab == 'favorites'}" 
                                type="button" 
                                class="btn btn-danger-light btn-small" 
                                data-action="remove-favorite" 
                                th:attr="data-id=${recipe.recipeId}" 
                                th:aria-label="|${recipe.title} 찜 해제|">♥ 찜 해제</button>
                    </div>
                </div>
            </article>
        </div>
        
        <!-- 페이징 UI (이전/다음 경로 동적 처리 및 active 클래스 적용) -->
		<div class="pagination-container" th:if="${totalPages > 1}">
		    <div class="pagination">
		        <!-- 이전 페이지 버튼 -->
		        <a th:if="${page > 1}" 
		           th:href="@{${tab == 'mine' ? '/my/recipes' : '/my/bookmarks'}(page=${page - 1}, size=${size}, sort=${sort})}" 
		           class="btn btn-light btn-small">이전</a>
		
		        <!-- 페이지 번호 반복 출력 -->
		        <a th:each="i : ${#numbers.sequence(1, totalPages)}" 
		           th:href="@{${tab == 'mine' ? '/my/recipes' : '/my/bookmarks'}(page=${i}, size=${size}, sort=${sort})}" 
		           th:text="${i}" 
		           th:class="${i == page} ? 'active' : ''">1</a>
		
		        <!-- 다음 페이지 버튼 -->
		        <a th:if="${page < totalPages}" 
		           th:href="@{${tab == 'mine' ? '/my/recipes' : '/my/bookmarks'}(page=${page + 1}, size=${size}, sort=${sort})}" 
		           class="btn btn-light btn-small">다음</a>
		    </div>
		</div>
    </section>
</th:block>

</body>
</html>
