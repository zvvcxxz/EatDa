<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{mykitchen/mykitchenLayout}">
<head>
    <title>1:1 문의 게시판 - 나의 주방</title>
    <!-- Quill Text Editor CDN -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <!-- Quill Image Resize Module CDN -->
    <script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>
    <!-- Vue 3 & Axios CDN, router -->
	<script src="https://unpkg.com/vue@3.5.22/dist/vue.global.js"></script>
	<script src="https://unpkg.com/vue-router@4.6.3/dist/vue-router.global.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/axios@1.12.2/dist/axios.min.js"></script>
	<script src="https://unpkg.com/pinia@3/dist/pinia.iife.prod.js"></script>
    <link rel="stylesheet" th:href="@{/css/mykitchen/myinquiries.css}">
</head>
<body>

<th:block layout:fragment="kitchenContent">

    <div class="page-title">
        <div class="container">
            <div class="page-title-underline-accent"></div>
        </div>
    </div>

    <section class="section my-inquiry-section">
        <div class="container">

            <!-- Vue 앱 진입점 -->
            <div id="vue-app">
                <router-view></router-view>
            </div>

            <th:block th:replace="~{mykitchen/myinquiry_list :: InquiryList}"></th:block>
            <th:block th:replace="~{mykitchen/myinquiry_detail :: InquiryDetail}"></th:block>
            <th:block th:replace="~{mykitchen/myinquiry_form :: InquiryForm}"></th:block>
            <th:block th:replace="~{mykitchen/myinquiry_reply :: InquiryReply}"></th:block>

        </div>
    </section>

</th:block>

<th:block layout:fragment="aside-container">
</th:block>

<th:block layout:fragment="script">
    <!-- 프로젝트 공통 Vue CDN  -->
   <!--  <th:block th:replace="~{vue/vue_cdn :: VUECDN}"></th:block> -->
    <!-- 프로젝트의 ES Module 진입점 -->
  <script type="module" th:src="@{/js/mykitchen/myinquiry.js}"></script>
</th:block>

</html>
