<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{mykitchen/mykitchenLayout}">
<th:block th:fragment="InquiryReply">

    <template id="inquiry-reply-template">
        <article class="child-inquiry-item">

            <details @toggle="toggleReply">
                <summary>
                    <div class="child-inquiry-summary">
                        <span class="inquiry-status" 
                        	:class="reply.status === 1  ? 'status-answered' : 'status-waiting'">
                            {{ reply.status === 1 ? '답변 완료' : '답변 대기' }}
                        </span>

                        <strong>{{ reply.title }}</strong>
                        <span class="inquiry-date">
                            {{ reply.createdAt }}
                        </span>
                    </div>
                </summary>

                <div class="inquiry-body">
                    <div v-if="loading">
                        추가 문의를 불러오는 중입니다.
                    </div>

                    <template v-else-if="detail">
                        <h3>추가 문의 내용</h3>
                        <div class="inquiry-detail-content" v-html="detail.content"></div>
                        
						<section v-if="detail.files && detail.files.length" class="file-attach-list">	
						    <h3>첨부파일</h3>						
						    <ul>
						        <li v-for="file in detail.files" :key="file.inquiryFileId" class="file-item">						
						            <a :href="fileDownloadUrl(file.inquiryFileId)">
						                {{ file.originalFileName }}
						            </a>
						        </li>
						    </ul>
						</section>
						
						<div v-if="detail.status === 0" class="inquiry-actions">
						    <button type="button" class="inquiry-btn inquiry-btn-outline"
						            @click="$emit('edit', reply.inquiryId)">
						        수정
						    </button>
						    <button type="button" class="inquiry-btn inquiry-btn-danger"
						            @click="removeReply">
						        삭제
						    </button>
						</div>

                        <section v-if="detail.answerContent" class="admin-answer">
                            <h3>관리자 답변</h3>
                            <div v-html="detail.answerContent"></div>
                        </section>
                        
                    </template>

                </div>
            </details>
        </article>
    </template>

</th:block>
</html>
