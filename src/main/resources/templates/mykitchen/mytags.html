<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{mykitchen/mykitchenLayout}">
<head>
    <title>관심 태그 & 카테고리 - 나의 주방</title>
</head>
<body>

<th:block layout:fragment="kitchenContent">
    <section class="panel">
        <div class="section-heading">
            <h2 th:text="${pageTitle}">관심 설정</h2>
        </div>

        <form id="tagForm">
            <!-- 1. 선호 카테고리 섹션 -->
            <div class="pref-section">
                <h3 class="pref-title">선호 카테고리</h3>
                <p class="pref-desc">자주 찾는 요리 스타일을 선택해 주세요.</p>
                
                <div class="chip-grid">
                    <label class="chip-choice" th:each="category : ${categories}">
                        <input type="checkbox" name="categoryIds" 
                               th:value="${category.categoryId}" 
                               th:checked="${category.selected}">
                        <span class="chip-label" th:text="${category.categoryName}">자취 🏠</span>
                    </label>
                </div>
            </div>

            <!-- 2. 관심 태그 섹션 -->
            <div class="pref-section">
                <h3 class="pref-title">관심 태그</h3>
                <p class="pref-desc">관심 있는 조리법, 재료, 상황 태그를 선택해 주세요.</p>
                
                <div class="chip-grid">
                    <label class="chip-choice" th:each="tag : ${tags}">
                        <input type="checkbox" name="tagIds" 
                               th:value="${tag.tagId}" 
                               th:checked="${tag.selected}">
                        <span class="chip-label" th:text="|# ${tag.tagName}|"># 10분요리 ⏱️</span>
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">관심 설정 저장</button>
            </div>
        </form>
    </section>
</th:block>

</body>
</html>
