<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{mykitchen/mykitchenLayout}">
<head>
    <title>나의 활동 - 나의 주방</title>
</head>
<body>

<th:block layout:fragment="kitchenContent">
    <section class="panel">
        <h2>월별 레시피 작성 활동</h2>
        <p class="muted">삭제되지 않은 레시피 기준입니다. 관리자 숨김 레시피도 포함합니다.</p>

        <div class="activity-chart" role="list" aria-label="월별 레시피 작성 수">
            <div class="chart-column" role="listitem"
                 th:each="month : ${monthlyActivities}"
                 th:aria-label="|${month.label}: ${month.count}개|">
                <strong th:text="${month.count}">0</strong>
                <div class="bar-track">
                    <div class="chart-bar" th:style="|height: ${month.percent}%;|"></div>
                </div>
                <span th:text="${month.label}">1월</span>
            </div>
        </div>
    </section>
</th:block>

</body>
</html>
